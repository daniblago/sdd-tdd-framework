name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: typecheck + tests + spec drift
    runs-on: ubuntu-latest
    env:
      # Secreto sintético, suficiente para cargar env() en CI
      JWT_SECRET: ci-jwt-secret-with-at-least-32-chars-long
      NODE_ENV: test
      BCRYPT_COST: '10'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Test suite (con cobertura, umbral 80%)
        run: npm run test:coverage

      - name: Spec drift check
        run: npm run spec:check
